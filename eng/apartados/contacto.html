<!DOCTYPE html>

    <link rel="icon" type="image/png" href="../imagenes/favicon.png">

    <link
        href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../../style.css">
</head>

<body>

    <header class="main-header">

        <a href="../index.html" class="logo">
            <img src="../imagenes/logo.png" alt="Bit3">
        </a>

        <nav class="navigation">
            <a href="../index.html">Blog</a>
            <a href="quienes-somos.html">Who We Are</a>
            <a href="objetivos.html">Objectives</a>
            <a href="entrevista.html">Interview</a>
            <a href="contacto.html">Contact</a>
        </nav>

        <div class="language-selector">

            <a href="../../index.html" class="language">
                <img src="../imagenes/espana.png" alt="Español">
            </a>

            <a href="../../cat/index.html" class="language">
                <img src="../imagenes/cataluna.png" alt="Catalan">
            </a>

            <a href="../index.html" class="language">
                <img src="../imagenes/inglaterra.png" alt="English">
            </a>

        </div>

    </header>

    <main>

        <section class="page-content">
            <h1>Contact</h1>
            <p>Do you have a question or a proposal? Write to us and we will get back to you as soon as possible.</p>
        </section>

        <form class="contact-form" action="https://formspree.io/f/xzezkypp" method="POST">

            <div class="form-group">
                <label for="nombre">Name</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="mensaje">Message</label>
                <textarea id="mensaje" name="mensaje" rows="6" required></textarea>
            </div>

            <button type="submit">Send message</button>

        </form>

    </main>

    <footer class="main-footer">
        <p>&copy; 2026 Bit3. All rights reserved.</p>
    </footer>

</body>
</html>
