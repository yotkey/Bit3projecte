    <main>

        <section class="page-content">
            <h1>Contacte</h1>
            <p>Tens alguna pregunta o proposta? Escriu-nos i et respondrem lo abans posible.</p>
        </section>

        <form class="contact-form" action="https://formspree.io/f/xzezkypp" method="POST">

            <div class="form-group">
                <label for="nombre">Nom</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="mensaje">Missatge</label>
                <textarea id="mensaje" name="mensaje" rows="6" required></textarea>
            </div>

            <button type="submit">Enviar missatge</button>

        </form>

    </main>
